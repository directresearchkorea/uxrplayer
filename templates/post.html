<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B9TVBF44ZR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-B9TVBF44ZR');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - UXR Player</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="{{ description }}">
    
    <!-- Open Graph (Facebook, Kakao) -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:image" content="{{ meta.thumbnail }}">
    <meta property="og:url" content="{{ site_url }}{{ meta.url }}">
    <meta property="og:site_name" content="UXR Player">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ meta.thumbnail }}">

    <!-- CSS (Relative for local viewing) -->
    <link rel="stylesheet" href="../../assets/css/style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K406SG5L11"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-K406SG5L11');
</script>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>
    <header>
        <div class="container">
            <a href="../../index.html" class="logo">
                <span class="icon">u<span class="red">X</span>r<span class="red">.</span></span>
                <span class="text">player</span>
            </a>
            <nav>
                <a href="../../index.html">Home</a>
                <div class="dropdown">
                    <a href="../../index.html#services" class="dropbtn" style="text-decoration:none;">Services <span class="caret">&#9662;</span></a>
                    <div class="dropdown-content">
                        <a href="../../deeppersona/index.html">DEEP PERSONA</a>
                        <a href="../../behavioralanalysis/index.html">BEHAVIORAL ANALYSIS</a>
                        <a href="../../videography/index.html">VIDEOGRAPHY</a>
                        <a href="https://eyetracking.uxrplayer.com/" target="_blank">EYE-TRACKING</a>
                    </div>
                </div>
                <a href="../../insights/index.html">Insights</a>
                <a href="../../index.html#team">Team</a>
                <a href="../../index.html#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <article class="post">
                {% if meta.thumbnail %}
                <img src="{{ meta.thumbnail }}" alt="{{ title }} Thumbnail" class="post-hero-image">
                {% endif %}
                
                <h1>{{ title }}</h1>
                
                <div class="post-meta">
                    {% if meta.formatted_date %}
                    <span class="date">Published on {{ meta.formatted_date }}</span>
                    {% endif %}
                </div>
                
                <div class="post-content">
                    {{ content }}
                </div>
            </article>
        </div>
    </main>

    <footer id="contact">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 UXR Player. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
