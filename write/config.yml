backend:
  name: github
  repo: directresearchkorea/uxrplayer
  branch: main
media_folder: "assets/images/posts"
public_folder: "/assets/images/posts"

collections:
  - name: "post"
    label: "Post"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Thumbnail URL", name: "thumbnail", widget: "string", required: false, hint: "Enter image URL or path like /assets/images/posts/img.jpg"}
      - {label: "Body", name: "body", widget: "markdown"}
