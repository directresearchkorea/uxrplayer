name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - 'posts/**.html'
      - 'insights/**.html'
      - 'introduction/**.html'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        run: |
          python build_post.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MARP Presentation
        run: |
          mkdir -p introduction
          npx @marp-team/marp-cli@latest templates/introduction.md -o introduction/index.html

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml posts/ introduction/
          git commit -m "Auto-generate HTML from markdown [skip ci]" || echo "No changes to commit"
          git push
